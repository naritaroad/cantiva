[package]
name = "cantiva-mcp"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
description = "MCP server that lets AI agents synthesize speech with Cantiva"
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
cantiva-api = { version = "0.2.0", path = "../crates/cantiva-api" }
cantiva-core = { version = "0.2.0", path = "../crates/cantiva-core" }
rand = "0.10.3"
rmcp = { version = "3.8.0", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
schemars = "1.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "process", "time"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
