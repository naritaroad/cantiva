name: Feature request
description: Suggest a new capability, engine or workflow.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What you'd like Cantiva to do. For a new engine, link the model and its license.
    validations:
      required: true
