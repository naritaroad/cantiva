name: Release

# 推送 v* tag（例如 v0.2.0）就建置安裝程式、免安裝版與 skill zip，並發佈成 GitHub Release。
# 手動執行（workflow_dispatch）只建置，檔案放在這次執行的 artifacts，不發佈。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup update stable && rustup default stable && rustup target add x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          key: release

      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $toml = Get-Content Cargo.toml -Raw
          if ($toml -notmatch '(?ms)^\[workspace\.package\].*?^version\s*=\s*"([^"]+)"') { throw 'no workspace version' }
          $version = $Matches[1]
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match Cargo.toml version $version" }
          "VERSION=$version" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }

      - name: Build and package
        shell: pwsh
        run: ./scripts/package.ps1 -OutDir release-assets

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cantiva-release
          path: release-assets/*
          if-no-files-found: error

      - name: Write release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: ./scripts/release-notes.ps1 -Version $env:VERSION -OutFile release-notes.md

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $files = Get-ChildItem release-assets -File | ForEach-Object { $_.FullName }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
            gh release edit $tag --notes-file release-notes.md
          } else {
            gh release create $tag @files --title "Cantiva $env:VERSION" --notes-file release-notes.md --verify-tag
          }
          if ($LASTEXITCODE -ne 0) { throw 'gh release failed' }
