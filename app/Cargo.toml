[package]
name = "cantiva"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1.0.104"
arboard = "3.7.0"
cantiva-api = { version = "0.1.0", path = "../crates/cantiva-api" }
cantiva-audio = { version = "0.1.0", path = "../crates/cantiva-audio" }
cantiva-core = { version = "0.1.0", path = "../crates/cantiva-core" }
cantiva-engine = { version = "0.1.0", path = "../crates/cantiva-engine" }
rfd = "0.17.2"
rodio = { version = "0.23.0", default-features = false, features = ["playback"] }
slint = "1.18.1"
time = { version = "0.3.55", features = ["local-offset", "macros", "formatting"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.29.0", features = ["v4", "serde"] }

[build-dependencies]
slint-build = "1.18.1"
winresource = "0.1.34"

[dev-dependencies]
png = "0.18.1"
