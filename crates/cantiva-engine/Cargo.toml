[package]
name = "cantiva-engine"
edition.workspace = true
version.workspace = true
license.workspace = true
authors.workspace = true
description = "Cantiva engine catalog, Python worker supervisor and Studio service"
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[dependencies]
cantiva-audio = { version = "0.1.0", path = "../cantiva-audio" }
cantiva-core = { version = "0.1.0", path = "../cantiva-core" }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
time = "0.3.55"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "fs", "io-util"] }
toml = "1.2.0"
tracing = "0.1.44"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
